# SonarQube Cloud (SonarCloud) configuration
# https://docs.sonarsource.com/sonarqube-cloud/

# --- Project identity (REQUIRED: fill in from your SonarQube Cloud project) ---
sonar.organization=gurubakshyadav2033
sonar.projectKey=GURUBAKSHYADAV-71218_HackJudge
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=HackJudge
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# --- Analysis scope ---
sonar.sources=src
sonar.tests=tests

# Never scan build output, dependencies, coverage output, or SQL/infra assets
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-ssr/**,**/build/**,**/coverage/**,**/public/**,**/supabase/**,**/*.sql,**/*.md,**/*.pdf

# Test file detection
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# --- Coverage ---
# Produced by `npm run test:coverage` (c8 wrapping the existing node:test suite)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
